<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biểu mẫu đăng kí ứng tuyển</title>
</head>
<body>
   <h2 style="color :yellow; background-color:rgb(255, 127, 127);font-size:50px;font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;text-align:center; ">Job Application: Front-End Developer</h2>

    <form action="/action_page.php" method="post" enctype="multipart/form-data" target="_self">
        <fieldset>
            <legend><b>Personal Information</b></legend>
            
            <label for="fullname"><b>Full Name</b></label><br>
            <input type="text" id="fullname" name="fullname"><br><br>
            
            <label for="email"><b>Email Address</b></label><br>
            <input type="email" id="email" name="email"><br><br>
            
            <label for="phone"><b>Phone</b></label><br>
            <input type="tel" id="phone" name="phone"><br>
        </fieldset><br>

        <fieldset>
            <legend><b>Application</b></legend>
            
            <label for="cover_letter"><b>Cover Letter</b></label><br>
            <textarea id="cover_letter" name="cover_letter" rows="6" cols="50" placeholder="Why are you a great fit for this role?"></textarea><br><br>
            
            <label for="resume"><b>Upload Resume/CV</b></label><br>
            <input type="file" id="resume" name="resume"><br>
        </fieldset> <br>

        <input type="submit" value="Submit Application">
    </form>
</body>
</html>
